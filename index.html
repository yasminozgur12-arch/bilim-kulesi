<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilim Kulesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  /* Yerleşim: üç katlı bir kule. Üstte kat göstergesi + yıldız sayacı, ortada tek soru kartı, altta sabit kontrol şeridi. */
  :root {
    --bg: #EEF2FF; --bg2: #DCE4FF; --card: #FFFFFF; --ink: #1D2B53; --muted: #56618A; --line: #CAD3F2;
    --sun: #FFC93C; --sun-ink: #6B4A00; --sun-soft: #FFF3CF;
    --coral: #F0623F; --coral-soft: #FFE2D9;
    --teal: #13A89E; --teal-soft: #D6F5F2; --teal-ink: #0B6F68;
    --violet: #6A4BD8; --violet-soft: #E7E1FF;
    --slot: #F7F9FF; --on-dark: #FFFFFF;
    --f-display: "Baloo 2", "Nunito", system-ui, sans-serif;
    --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12172B; --bg2: #1A2140; --card: #1F2747; --ink: #EEF1FF; --muted: #A9B2D6; --line: #34406E;
      --sun: #FFC93C; --sun-ink: #FFE29A; --sun-soft: #3A3320;
      --coral: #FF8466; --coral-soft: #44281F;
      --teal: #34CFC3; --teal-soft: #173C3D; --teal-ink: #8DEDE5;
      --violet: #A28CFF; --violet-soft: #2E2858;
      --slot: #182039; --on-dark: #12172B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12172B; --bg2: #1A2140; --card: #1F2747; --ink: #EEF1FF; --muted: #A9B2D6; --line: #34406E;
    --sun: #FFC93C; --sun-ink: #FFE29A; --sun-soft: #3A3320;
    --coral: #FF8466; --coral-soft: #44281F;
    --teal: #34CFC3; --teal-soft: #173C3D; --teal-ink: #8DEDE5;
    --violet: #A28CFF; --violet-soft: #2E2858;
    --slot: #182039; --on-dark: #12172B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, var(--bg2) 0 120px, transparent 121px), radial-gradient(circle at 90% 70%, var(--bg2) 0 160px, transparent 161px);
    background-attachment: fixed;
    color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.45;
    -webkit-user-select: none; user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--card); }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Üst şerit */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--card); border-bottom: 3px solid var(--ink); }
  .top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; min-height: 62px; }
  .floor-ind { display: flex; flex-direction: column-reverse; gap: 3px; }
  .floor-ind i { display: block; width: 34px; height: 9px; border-radius: 3px; background: var(--line); }
  .floor-ind i.on { background: var(--sun); } .floor-ind i.done { background: var(--teal); }
  .top-mid { flex: 1; min-width: 0; }
  .top-title { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qbar { display: flex; gap: 4px; margin-top: 5px; }
  .qbar span { flex: 1; height: 7px; border-radius: 99px; background: var(--line); }
  .qbar span.ok { background: var(--teal); } .qbar span.part { background: var(--sun); } .qbar span.miss { background: var(--coral); } .qbar span.cur { background: var(--violet); }
  .stars { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; background: var(--sun-soft); color: var(--sun-ink); border: 2px solid var(--sun); border-radius: 99px; padding: 4px 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .spk { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 1.2rem; cursor: pointer; flex-shrink: 0; }
  .spk.on { border-color: var(--teal); background: var(--teal-soft); }

  /* Düğmeler */
  .btn { min-height: 60px; padding: 10px 24px; border-radius: 18px; font-size: 1.2rem; font-weight: 800; font-family: var(--f-display); border: 3px solid var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sun { background: var(--sun); color: #1D2B53; }
  .btn-teal { background: var(--teal); color: #FFFFFF; }
  .btn-violet { background: var(--violet); color: #FFFFFF; }

  /* Başlangıç */
  .start { flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 28px; }
  .start-card { width: 100%; max-width: 560px; background: var(--card); border: 3px solid var(--ink); border-radius: 30px; padding: 26px 22px; box-shadow: 10px 10px 0 var(--violet); text-align: center; }
  .tower { width: 150px; height: auto; margin: 0 auto 6px; display: block; }
  .start h1 { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; margin: 0 0 6px; }
  .start .sub { color: var(--muted); font-weight: 800; margin: 0 0 16px; }
  .steps6 { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .steps6 span { font-size: .85rem; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--violet-soft); color: var(--violet); }
  .steps6 b { opacity: .7; margin-right: 3px; }
  .name-in { width: 100%; min-height: 60px; font-size: 1.3rem; font-family: var(--f-body); font-weight: 800; text-align: center; border: 3px solid var(--line); border-radius: 16px; background: var(--slot); color: var(--ink); padding: 8px 14px; -webkit-user-select: text; user-select: text; }
  .name-in:focus { border-color: var(--violet); outline: none; }
  .lbl { display: block; font-weight: 800; margin-bottom: 8px; }
  .err { color: var(--coral); font-weight: 800; margin: 8px 0 0; }
  .full { width: 100%; margin-top: 16px; }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; font-size: .9rem; font-weight: 800; color: var(--muted); }
  .rules div { background: var(--slot); border-radius: 14px; padding: 8px 6px; }
  .rules b { display: block; font-size: 1.3rem; }

  /* Kat ekranı */
  .floor { flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 28px; }
  .floor-card { width: 100%; max-width: 560px; text-align: center; background: var(--card); border: 3px solid var(--ink); border-radius: 30px; padding: 28px 22px; box-shadow: 10px 10px 0 var(--sun); animation: rise .45s ease-out; }
  @keyframes rise { from { transform: translateY(18px); opacity: .5; } to { transform: none; opacity: 1; } }
  .floor-num { display: inline-block; font-family: var(--f-display); font-weight: 800; background: var(--ink); color: var(--card); border-radius: 99px; padding: 2px 16px; letter-spacing: .06em; }
  .floor-card h2 { font-family: var(--f-display); font-size: 2.1rem; line-height: 1.05; margin: 12px 0 8px; }
  .floor-card p { margin: 0 0 6px; font-weight: 700; color: var(--muted); }
  .badge-big { font-size: 4rem; line-height: 1; margin: 6px 0; }
  .floor-stars { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; color: var(--sun-ink); background: var(--sun-soft); border-radius: 16px; padding: 8px; margin: 12px 0; }

  /* Soru */
  .stage { flex: 1; padding-block: 16px 250px; }
  .q-card { background: var(--card); border: 3px solid var(--ink); border-radius: 26px; padding: 18px 16px 20px; box-shadow: 8px 8px 0 var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-size: .8rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; background: var(--violet-soft); color: var(--violet); }
  .chip.lv1 { background: var(--teal-soft); color: var(--teal-ink); } .chip.lv2 { background: var(--sun-soft); color: var(--sun-ink); } .chip.lv3 { background: var(--coral-soft); color: var(--coral); }
  .chip.type { background: var(--slot); color: var(--muted); border: 1px solid var(--line); }
  .story { font-size: 1.08rem; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  .prompt { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; line-height: 1.15; margin: 0 0 14px; text-wrap: balance; }
  .qnum { color: var(--violet); margin-right: 6px; }

  /* Çoktan seçmeli */
  .mc { display: grid; gap: 10px; }
  @media (min-width: 720px) { .mc.two { grid-template-columns: 1fr 1fr; } }
  .opt { width: 100%; min-height: 64px; text-align: left; display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 16px; border: 3px solid var(--line); background: var(--slot); font-size: 1.05rem; font-weight: 800; cursor: pointer; }
  .opt .L { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet); font-family: var(--f-display); font-size: 1.2rem; }
  .opt.sel { border-color: var(--violet); background: var(--violet-soft); }
  .opt.sel .L { background: var(--violet); color: #fff; }
  .opt.bad { border-color: var(--coral); background: var(--coral-soft); opacity: .7; text-decoration: line-through; text-decoration-color: var(--coral); }
  .opt.good { border-color: var(--teal); background: var(--teal-soft); }
  .opt.good .L { background: var(--teal); color: #fff; }
  .opt:disabled { cursor: default; }
  .opt span:last-child { min-width: 0; }

  /* Kart yerleştirme */
  .tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; border-radius: 18px; border: 3px solid var(--violet); margin: 0 0 14px; min-height: 64px; background: var(--card); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 45; max-height: 38vh; overflow-y: auto; box-shadow: 0 8px 18px rgba(29,43,83,.18); }
  .tray .tok { font-size: .95rem; min-height: 48px; padding: 6px 12px; }
  .tray-title { width: 100%; text-align: center; font-weight: 900; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tray.empty { position: static; box-shadow: none; border-style: dashed; border-color: var(--line); min-height: 0; }
  .tray.empty .tray-title::after { content: " · hepsi yerleşti"; }
  .tok { min-height: 54px; padding: 8px 14px; border-radius: 14px; border: 3px solid var(--ink); background: var(--card); font-weight: 800; font-size: 1rem; line-height: 1.25; cursor: grab; touch-action: none; display: inline-flex; align-items: center; text-align: left; box-shadow: 0 4px 0 var(--ink); max-width: 100%; }
  .tok.sel { background: var(--sun-soft); border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun); }
  .tok.bad { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 4px 0 var(--coral); }
  .tok.good { border-color: var(--teal); background: var(--teal-soft); box-shadow: none; }
  .tok.ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .92; transform: rotate(-2deg) scale(1.04); }
  .tok.dragging { opacity: .3; }
  .tok.lock { cursor: default; }
  .slot { border: 3px dashed var(--muted); border-radius: 16px; background: var(--slot); min-height: 62px; padding: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: background .15s, border-color .15s; }
  .slot.empty::before { content: attr(data-ph); color: var(--muted); font-weight: 800; font-size: .95rem; }
  .slot.target { border-color: var(--sun); }
  .slot.over { border-color: var(--sun); background: var(--sun-soft); }
  .slot .tok { box-shadow: none; }
  .order { display: flex; flex-direction: column; gap: 10px; }
  .order-row { display: flex; gap: 10px; align-items: stretch; }
  .order-row .n { width: 44px; flex-shrink: 0; border-radius: 14px; background: var(--ink); color: var(--card); font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; display: grid; place-items: center; }
  .order-row .slot { flex: 1; min-width: 0; justify-content: flex-start; }
  .match { display: flex; flex-direction: column; gap: 10px; }
  .match-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
  .match-row .def { background: var(--violet-soft); color: var(--ink); border-radius: 16px; padding: 10px 12px; font-weight: 800; display: flex; align-items: center; min-width: 0; }
  @media (max-width: 560px) { .match-row { grid-template-columns: 1fr; gap: 6px; } }
  .bins { display: grid; gap: 12px; }
  .bins.b2 { grid-template-columns: 1fr 1fr; } .bins.b3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 640px) { .bins.b2, .bins.b3 { grid-template-columns: 1fr; } }
  .bin { display: flex; flex-direction: column; border-radius: 18px; border: 3px solid var(--ink); overflow: hidden; background: var(--card); min-width: 0; }
  .bin-h { padding: 8px 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; text-align: center; }
  .bin .slot { flex: 1; min-height: 130px; border: none; border-radius: 0; align-content: flex-start; }
  .bh-teal { background: var(--teal-soft); color: var(--teal-ink); } .bh-coral { background: var(--coral-soft); color: var(--coral); } .bh-violet { background: var(--violet-soft); color: var(--violet); } .bh-sun { background: var(--sun-soft); color: var(--sun-ink); }

  /* Tablo */
  .tbl-wrap { overflow-x: auto; border: 3px solid var(--ink); border-radius: 16px; margin: 6px 0 14px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; text-align: center; border-bottom: 2px solid var(--line); font-weight: 800; white-space: nowrap; }
  th { background: var(--violet-soft); color: var(--violet); }
  td:first-child, th:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }

  /* Çetele + grafik */
  .tally-box { display: grid; gap: 8px; margin-bottom: 14px; }
  .tally-row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; background: var(--slot); border-radius: 14px; padding: 8px 12px; font-weight: 900; }
  .tally-row svg { height: 34px; width: auto; max-width: 100%; }
  .tally-row svg line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .chart { display: grid; grid-template-columns: 34px 1fr; gap: 6px; }
  .yaxis { position: relative; height: 240px; font-size: .8rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .yaxis span { position: absolute; right: 2px; transform: translateY(50%); }
  .plot { position: relative; height: 240px; border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 16px; padding: 0 12px; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .barc { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; z-index: 1; }
  .barc .bar { width: 70%; max-width: 80px; border-radius: 10px 10px 0 0; transition: height .15s; }
  .barc .bv { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
  .xl { display: grid; grid-template-columns: 34px repeat(3, 1fr); gap: 6px; font-weight: 900; text-align: center; margin-top: 4px; }
  .stepper { display: flex; justify-content: center; gap: 14px; align-items: center; margin-top: 12px; }
  .stepper button { width: 64px; height: 60px; border-radius: 16px; border: 3px solid var(--ink); background: var(--card); font-family: var(--f-display); font-size: 1.8rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .stepper button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .stepper .sv { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; min-width: 150px; text-align: center; }

  /* Afiş deneyi */
  .posters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; margin-bottom: 14px; }
  .poster-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .poster { width: 78%; aspect-ratio: 3/4; border: 3px solid var(--ink); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; transition: all .2s; overflow: hidden; }
  .poster.big { width: 96%; }
  .poster.cold { background: #CFE3FF; } .poster.warm { background: #FFD3B0; }
  .poster .pt { font-family: var(--f-display); font-weight: 800; color: #1D2B53; line-height: 1; text-align: center; }
  .poster .pt.s { font-size: 1rem; } .poster .pt.l { font-size: 1.7rem; }
  .poster .pi { font-size: 2.4rem; }
  .poster-name { font-weight: 900; color: var(--muted); }
  .props { display: grid; gap: 10px; }
  .prop { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
  .prop .pn { font-weight: 900; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { min-height: 52px; border-radius: 14px; border: 3px solid var(--line); background: var(--slot); font-weight: 800; font-size: 1rem; cursor: pointer; }
  .seg button.on { border-color: var(--violet); background: var(--violet-soft); color: var(--violet); }
  .prop.bad .seg button.on { border-color: var(--coral); background: var(--coral-soft); color: var(--coral); }
  .prop.good .seg button.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal-ink); }
  .seg button:disabled { cursor: default; }
  .a-fixed { font-size: .85rem; color: var(--muted); font-weight: 800; }

  /* Tuş takımı */
  .calc { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; }
  .readout { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 2rem; font-weight: 800; }
  .rv { min-width: 110px; min-height: 70px; border: 3px dashed var(--muted); border-radius: 16px; background: var(--slot); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .rv.f { border-style: solid; border-color: var(--ink); } .rv.bad { border-color: var(--coral); background: var(--coral-soft); } .rv.good { border-color: var(--teal); background: var(--teal-soft); }
  .keypad { display: grid; grid-template-columns: repeat(3, 62px); gap: 8px; }
  .key { width: 62px; height: 56px; border-radius: 14px; border: 3px solid var(--ink); background: var(--card); font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  /* Hatayı bul */
  .flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
  .fblock { min-height: 60px; text-align: left; padding: 10px 14px; border-radius: 16px; border: 3px solid var(--ink); background: var(--slot); font-weight: 800; font-size: 1.02rem; cursor: pointer; }
  .fblock.sel { background: var(--sun-soft); border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun); }
  .fblock.bad { background: var(--coral-soft); border-color: var(--coral); text-decoration: line-through; }
  .fblock.good { background: var(--teal-soft); border-color: var(--teal); }
  .fblock:disabled { cursor: default; }
  .farrow { text-align: center; font-weight: 900; color: var(--muted); line-height: 1.4; }

  /* Alt şerit */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 3px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .dock .wrap { padding-block: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .dock-row { display: flex; gap: 12px; }
  .dock-row .btn { flex: 1; }
  .dock-row .btn.hint { flex: 0 0 auto; }
  .msg { border-radius: 16px; padding: 10px 14px; font-weight: 800; display: flex; gap: 10px; align-items: flex-start; }
  .msg .mi { font-size: 1.4rem; line-height: 1.1; }
  .msg.hint { background: var(--violet-soft); color: var(--violet); }
  .msg.warn { background: var(--sun-soft); color: var(--sun-ink); }
  .msg.retry { background: var(--coral-soft); color: var(--coral); }
  .msg.ok { background: var(--teal-soft); color: var(--teal-ink); }
  .msg.reveal { background: var(--violet-soft); color: var(--ink); }

      if (cur.sel === null) return { complete: false, msg: q.type === "mc" ? "Önce bir seçenek seç." : "Önce bir adıma dokun." };
      r.ok = cur.sel === q.c; if (!r.ok) r.bad[cur.sel] = 1;
      r.did = q.type === "mc" ? q.opts[cur.sel] : q.blocks[cur.sel]; return r;
    }
    if (q.tokens) {
      var free = cur.toks.filter(function (t) { return !cur.place[t.id]; });
      if (free.length) return { complete: false, msg: "Önce bütün kartları yerleştir." };
      cur.toks.forEach(function (t) { if (cur.place[t.id] !== t.a) r.bad[t.id] = 1; });
      r.ok = !Object.keys(r.bad).length;
      r.did = (cur.toks.length - Object.keys(r.bad).length) + "/" + cur.toks.length + " kart doğru yerde";
      return r;
    }
    if (q.type === "chart") {
      if (cur.v === 0) return { complete: false, msg: "Önce + düğmesiyle sütunu yükselt." };
      r.ok = cur.v === 15; if (!r.ok) r.bad.v = 1; r.did = "Mandalina sütunu: " + cur.v; return r;
    }
    if (q.type === "toggles") {
      var changed = PROPS.filter(function (p) { return cur.tg[p.k] !== A_POSTER[p.k]; }).map(function (p) { return p.k; });
      if (!changed.length) return { complete: false, msg: "B afişi hâlâ A ile aynı. Bir özelliği değiştir." };
      changed.forEach(function (k) { if (k !== "renk") r.bad[k] = 1; });
      if (changed.indexOf("renk") < 0) r.bad.renk = 1;
      r.ok = changed.length === 1 && changed[0] === "renk";
      r.did = "Değiştirilen: " + changed.map(function (k) { return PROPS.filter(function (p) { return p.k === k; })[0].n; }).join(", ");
      return r;
    }
    if (q.type === "calc") {
      if (!cur.num) return { complete: false, msg: "Önce cevabını yaz." };
      r.ok = +cur.num === q.ans; if (!r.ok) r.bad.num = 1; r.did = "Cevabın: " + cur.num + " " + q.unit; return r;
    }
    return r;
  }
  function check() {
    var q = Q[G.i], r = evaluate(q);
    if (!r.complete) { cur.msg = { k: "warn", i: "✋", t: r.msg }; beep([330]); renderDock(); return; }
    cur.attempt++;
    if (cur.attempt === 1) G.res[G.i] = { first: r.ok, did: r.did, stars: 0, final: false };
    if (r.ok) {
      var stars = cur.attempt === 1 ? (cur.hint ? 2 : 3) : 1;
      G.res[G.i].stars = stars; G.res[G.i].final = true;
      cur.done = true; cur.sel = null;
      cur.msg = { k: "ok", i: "🎉", b: (cur.attempt === 1 ? "Harika! " : "Bu sefer oldu! ") + '<span class="gain">+' + "⭐".repeat(stars) + "</span>", t: q.exp };
      beep([523, 659, 784, 1047]);
      render(); return;
    }
    if (cur.attempt === 1) {
      cur.bad = r.bad;
      if (q.type === "mc" || q.type === "pick") cur.sel = null;
      cur.msg = { k: "retry", i: "🔁", b: "Neredeyse!", t: q.tokens ? "Kırmızı kartlar yanlış yerde. Onları taşı ve tekrar kontrol et." : q.type === "toggles" ? "Kırmızı satırlara bak. Bir daha dene." : "Bir daha dene. İstersen ipucuna bak." };
      beep([392, 330], "sine"); render(); return;
    }
    // ikinci yanlış: çözümü göster
    G.res[G.i].stars = 0; G.res[G.i].final = false;
    cur.done = true; cur.sel = null;
    if (q.type !== "mc" && q.type !== "pick") cur.bad = {};
    if (q.tokens) cur.toks.forEach(function (t) { cur.place[t.id] = t.a; });
    cur.msg = { k: "reveal", i: "💬", b: "Birlikte bakalım.", t: q.exp };
    beep([392, 494], "sine"); render();
  }

  /* =================== KARNE =================== */
  var openRow = null, pngUrl = null;
  function showReport(celebrate) {
    var tot = totalStars(), first = G.res.filter(function (r) { return r && r.first; }).length;
    var h = topHtml("Araştırmacı Karnesi") + '<main class="wrap report"><div class="rep-card"><h1>Araştırmacı Karnem</h1><div class="rep-name">' + esc(G.name) + "</div>" +
      '<div class="rep-stats"><div><b>⭐ ' + tot + "</b>/ 45 yıldız</div><div><b>" + first + "</b>ilk denemede doğru</div><div><b>" + rank(tot) + "</b>unvan</div></div>" +
      '<div class="badges">' + FLOORS.map(function (F, f) { var got = floorStars(f) >= 8; return '<div class="bdg ' + (got ? "got" : "not") + '"><span class="e" aria-hidden="true">' + F.e + "</span>" + F.badge + "<br><small>⭐ " + floorStars(f) + "/15</small></div>"; }).join("") + "</div>" +
      '<div class="rows">' + Q.map(function (q, k) {
        var r = G.res[k], c = r.first ? "ok" : r.final ? "part" : "miss";
        var row = '<div class="rrow"><button type="button" data-r="' + k + '" aria-expanded="' + (openRow === k) + '"><span class="rn ' + c + '">' + (k + 1) + '</span><span class="rt">' + esc(q.subj) + "<small>" + TYPE[q.type] + " · " + FLOORS[q.floor].lv + '</small></span><span class="rs">' + (r.stars ? "⭐".repeat(r.stars) : "—") + "</span></button>";
        if (openRow === k) row += '<div class="rdet"><div><b>Soru:</b> ' + esc(q.prompt) + "</div><div><b>İlk cevabın:</b> " + esc(r.did) + (r.first ? " ✓" : "") + "</div><div><b>Doğru çözüm:</b> " + esc(q.sol) + "</div><div><b>Neden?</b> " + esc(q.exp) + "</div></div>";
        return row + "</div>";
      }).join("") + "</div>" +
      '<div class="rep-actions"><button type="button" class="btn btn-violet" id="save">Karnemi Kaydet 💾</button><button type="button" class="btn" id="again">Yeniden Oyna ↺</button></div>' +
      '<p class="save-msg" id="smsg" hidden></p>' + (pngUrl ? '<img class="save-img" src="' + pngUrl + '" alt="Araştırmacı Karnem görseli">' : "") +
      "</div></main>";
    app.innerHTML = h; bindSpk();
    app.querySelectorAll(".rrow > button").forEach(function (b) { b.onclick = function () { var k = +b.dataset.r; openRow = openRow === k ? null : k; var y = window.scrollY; showReport(false); window.scrollTo(0, y); }; });
    document.getElementById("save").onclick = saveCard;
    var armed = false;
    document.getElementById("again").onclick = function () {
      if (!armed) { armed = true; this.textContent = "Emin misin? Tekrar dokun"; return; }
      showStart();
    };
    if (celebrate) { window.scrollTo(0, 0); confetti(); }
  }
  function rank(t) { return t >= 40 ? "Bilim İnsanı" : t >= 30 ? "Araştırmacı" : t >= 18 ? "Kâşif" : "Çırak"; }

  /* ---- Konfeti ---- */
  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.getElementById("confetti"), ctx = null; try { ctx = cv.getContext("2d"); } catch (e) {} if (!ctx) return;
    cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
    var cols = ["#FFC93C", "#F0623F", "#13A89E", "#6A4BD8", "#4C8DF6"], P = [];
    for (var k = 0; k < 140; k++) P.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, s: 6 + Math.random() * 6, c: cols[k % cols.length] });
    var t = 0;
    (function step() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (++t < 220) requestAnimationFrame(step); else { cv.hidden = true; }
    })();
  }

  /* ---- PNG ---- */
  function wrapLines(ctx, text, w) {
    var words = String(text).split(" "), out = [], line = "";
    words.forEach(function (wd) { var t = line ? line + " " + wd : wd; if (ctx.measureText(t).width > w && line) { out.push(line); line = wd; } else line = t; });
    if (line) out.push(line); return out;
  }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function buildPng() {
    var W = 1080, P = 50, TX = P + 92, TW = W - TX - P - 20;
    var F = '"Nunito", system-ui, sans-serif', D = '"Baloo 2", "Nunito", system-ui, sans-serif';
    var c = document.createElement("canvas"), x = c.getContext("2d");
    x.font = "700 23px " + F;
    var rows = Q.map(function (q, k) {
      var r = G.res[k];
      var a = wrapLines(x, "İlk cevabın: " + r.did, TW), b = wrapLines(x, "Doğru çözüm: " + q.sol, TW);
      return { a: a, b: b, h: 58 + (a.length + b.length) * 30 + 22 };
    });
    var HEAD = 330, H = HEAD + rows.reduce(function (s, r) { return s + r.h + 12; }, 0) + 70;
    c.width = W; c.height = H;
    x.fillStyle = "#EEF2FF"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#1D2B53"; x.fillRect(0, 0, W, 14);
    var tot = totalStars(), first = G.res.filter(function (r) { return r.first; }).length;
    x.textAlign = "center"; x.fillStyle = "#1D2B53"; x.font = "800 64px " + D; x.fillText("Araştırmacı Karnem", W / 2, 100);
    x.fillStyle = "#6A4BD8"; x.font = "700 40px " + D; x.fillText(G.name, W / 2, 152);
    var boxes = [["⭐ " + tot + " / 45", "yıldız"], [first + " / 15", "ilk denemede doğru"], [rank(tot), "unvan"]];
    boxes.forEach(function (b, k) {
      var bx = P + k * ((W - 2 * P - 40) / 3 + 20), bw = (W - 2 * P - 40) / 3;
      x.fillStyle = "#FFFFFF"; x.strokeStyle = "#1D2B53"; x.lineWidth = 4; rr(x, bx, 190, bw, 110, 20); x.fill(); x.stroke();
      x.fillStyle = "#1D2B53"; x.font = "800 38px " + D; x.fillText(b[0], bx + bw / 2, 245);
      x.fillStyle = "#56618A"; x.font = "800 22px " + F; x.fillText(b[1], bx + bw / 2, 280);
    });
    var y = HEAD;
    Q.forEach(function (q, k) {
      var r = G.res[k], R = rows[k];
      var col = r.first ? "#13A89E" : r.final ? "#E0A800" : "#F0623F";
      x.fillStyle = "#FFFFFF"; x.strokeStyle = col; x.lineWidth = 4; rr(x, P, y, W - 2 * P, R.h, 18); x.fill(); x.stroke();
      x.fillStyle = col; x.beginPath(); x.arc(P + 46, y + 44, 28, 0, 6.283); x.fill();
      x.fillStyle = "#FFFFFF"; x.textAlign = "center"; x.font = "800 28px " + D; x.fillText(String(k + 1), P + 46, y + 54);
      x.textAlign = "left"; x.fillStyle = "#1D2B53"; x.font = "800 27px " + D; x.fillText(q.subj + " · " + TYPE[q.type], TX, y + 42);
      x.textAlign = "right"; x.fillStyle = col; x.font = "800 24px " + F;
      x.fillText((r.first ? "İlk denemede doğru" : r.final ? "İkinci denemede doğru" : "Tekrar çalış") + "  " + r.stars + "★", W - P - 18, y + 42);
      x.textAlign = "left"; x.font = "700 23px " + F;
      var ly = y + 80;
      x.fillStyle = "#1D2B53"; R.a.forEach(function (l) { x.fillText(l, TX, ly); ly += 30; });
      x.fillStyle = "#0B6F68"; R.b.forEach(function (l) { x.fillText(l, TX, ly); ly += 30; });
      y += R.h + 12;
    });
    x.textAlign = "center"; x.fillStyle = "#56618A"; x.font = "700 22px " + F; x.fillText("Bilim Kulesi · @jasmin.eduflow", W / 2, H - 28);
    return c;
  }
  var dlP = null;
  function getDl() { if (!dlP) dlP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function () { return null; }) : Promise.resolve(null); return dlP; }
  function smsg(t) { var m = document.getElementById("smsg"); if (m) { m.hidden = !t; m.textContent = t; } }
  function saveCard() {
    var b = document.getElementById("save"); b.disabled = true;
    ((document.fonts && document.fonts.ready) || Promise.resolve()).then(function () {
      var cv = buildPng();
      cv.toBlob(function (blob) {
        var fn = "bilim-kulesi-karne-" + G.name.replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g, "-").slice(0, 30) + ".png";
        getDl().then(function (dl) {
          if (!dl) {
            try {
              var u = URL.createObjectURL(blob), ln = document.createElement("a");
              ln.href = u; ln.download = fn; document.body.appendChild(ln); ln.click(); ln.remove();
              setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
            } catch (er) {}
            fallback(cv, "Karnen indirildi. İnmediyse aşağıdaki görsele basılı tut ve kaydet."); return;
          }
          return dl.save({ filename: fn, data: blob }).then(function () { smsg("Karnen kaydedildi. 🎉"); }, function (e) {
            var code = e && e.code;
            if (code === "declined") smsg("Kaydetme iptal edildi. İstersen tekrar dokun.");
            else if (code === "rate_limited") smsg("Biraz bekleyip tekrar dokun.");
            else fallback(cv);
          });
        }).then(function () { var bb = document.getElementById("save"); if (bb) bb.disabled = false; });
      }, "image/png");
    });
  }
  function fallback(cv, note) {
    pngUrl = cv.toDataURL("image/png"); showReport(false);
    smsg(note || "Aşağıdaki görsele basılı tut ve kaydet.");
    var im = app.querySelector(".save-img"); if (im) im.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  showStart();
})();
</script>
